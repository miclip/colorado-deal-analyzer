<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Colorado blue sky background -->
  <rect width="128" height="128" rx="16" fill="#1e40af"/>
  <!-- House body -->
  <rect x="32" y="62" width="64" height="46" rx="4" fill="#fff"/>
  <!-- Roof -->
  <polygon points="24,66 64,28 104,66" fill="#dc2626"/>
  <!-- Door -->
  <rect x="52" y="80" width="18" height="28" rx="2" fill="#1e40af"/>
  <!-- Dollar sign -->
  <text x="61" y="101" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#fff" text-anchor="middle">$</text>
  <!-- Window left -->
  <rect x="38" y="72" width="12" height="12" rx="1" fill="#93c5fd"/>
  <!-- Window right -->
  <rect x="78" y="72" width="12" height="12" rx="1" fill="#93c5fd"/>
  <!-- Chimney -->
  <rect x="80" y="32" width="10" height="24" rx="1" fill="#991b1b"/>
</svg>
